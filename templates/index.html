<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangalore Home Price Predictor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title">Home Price<br><span>Predictor</span></h1>
            <p class="hero-subtitle">Bangalore, India</p>
            <p class="hero-desc">Get an accurate estimate of your property's market value using our ML-powered prediction engine.</p>
        </div>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2>Property Details</h2>
                <p>Fill in the details below to get your estimate</p>
            </div>

            <div class="card-body">
                <div class="form-group">
                    <label for="uiSqft">Area (Sq. Ft.)</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="3" y1="9" x2="21" y2="9"></line>
                            <line x1="9" y1="21" x2="9" y2="9"></line>
                        </svg>
                        <input type="number" class="form-input" id="uiSqft" name="Squareft" value="1000" min="300" max="10000" placeholder="Enter area in sq. ft.">
                    </div>
                </div>

                <div class="form-group">
                    <label>Bedrooms (BHK)</label>
                    <div class="switch-field">
                        <input type="radio" id="radio-bhk-1" name="uiBHK" value="1">
                        <label for="radio-bhk-1">1</label>
                        <input type="radio" id="radio-bhk-2" name="uiBHK" value="2">
                        <label for="radio-bhk-2">2</label>
                        <input type="radio" id="radio-bhk-3" name="uiBHK" value="3" checked>
                        <label for="radio-bhk-3">3</label>
                        <input type="radio" id="radio-bhk-4" name="uiBHK" value="4">
                        <label for="radio-bhk-4">4</label>
                        <input type="radio" id="radio-bhk-5" name="uiBHK" value="5">
                        <label for="radio-bhk-5">5</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Bathrooms</label>
                    <div class="switch-field">
                        <input type="radio" id="radio-bath-1" name="uiBath" value="1">
                        <label for="radio-bath-1">1</label>
                        <input type="radio" id="radio-bath-2" name="uiBath" value="2">
                        <label for="radio-bath-2">2</label>
                        <input type="radio" id="radio-bath-3" name="uiBath" value="3" checked>
                        <label for="radio-bath-3">3</label>
                        <input type="radio" id="radio-bath-4" name="uiBath" value="4">
                        <label for="radio-bath-4">4</label>
                        <input type="radio" id="radio-bath-5" name="uiBath" value="5">
                        <label for="radio-bath-5">5</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="uiLocations">Location</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                        <select name="location" id="uiLocations" class="form-input form-select">
                            <option value="" disabled selected>Choose a Location</option>
                        </select>
                    </div>
                </div>

                <button class="btn-estimate" onclick="onClickedEstimatedPrice()" type="button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                        <polyline points="17 6 23 6 23 12"></polyline>
                    </svg>
                    Estimate Price
                </button>

                <div id="uiEstimatedPrice" class="result">
                    <div class="result-placeholder">Your estimated price will appear here</div>
                </div>
            </div>
        </div>
    </div>


    <script src="/static/script.js"></script>
</body>
</html>
